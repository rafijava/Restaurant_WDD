<head>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">🌶️ Spice Garden</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
        <li class="nav-item"><a class="nav-link active" href="booking.html">Booking</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="page-header">
  <h1>Reserve a Table</h1>
  <p>Fill in the details below and we will save your spot.</p>
</div>

<div class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="form-card">
        <form id="bookingForm" novalidate>

          <div class="mb-3">
            <label for="name" class="form-label">Full Name *</label>
            <input type="text" class="form-control" id="name" placeholder="Your full name">
            <div class="invalid-feedback" id="nameError"></div>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number *</label>
            <input type="tel" class="form-control" id="phone" placeholder="e.g. 01712345678" maxlength="11">
            <div class="invalid-feedback" id="phoneError"></div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="date" class="form-label">Reservation Date *</label>
              <input type="date" class="form-control" id="date">
              <div class="invalid-feedback" id="dateError"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="time" class="form-label">Preferred Time</label>
              <input type="time" class="form-control" id="time">
            </div>
          </div>

          <div class="mb-3">
            <label for="guests" class="form-label">Number of Guests *</label>
            <input type="number" class="form-control" id="guests" placeholder="1 - 12" min="1" max="12">
            <div class="invalid-feedback" id="guestsError"></div>
          </div>

          <div class="mb-3">
            <label for="notes" class="form-label">Special Requests</label>
            <textarea class="form-control" id="notes" rows="3" placeholder="Allergies, seating preference, occasion, etc."></textarea>
          </div>

          <button type="submit" class="btn btn-brand w-100">Confirm Booking</button>

          <div class="alert alert-success mt-3 d-none" id="successMessage" role="alert"></div>

        </form>
      </div>
    </div>
  </div>
</div>

<footer class="py-4">
  <div class="container text-center">
    <p class="fw-bold fs-5 text-white mb-1">🌶️ Spice Garden Restaurant</p>
    <p class="small mb-1">123 Flavor Street, Gulshan, Dhaka</p>
    <p class="small mb-3">Open daily · 11:00 AM - 11:00 PM</p>
    <p class="small opacity-75 mb-0">&copy; <span id="year"></span> Spice Garden Restaurant. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
